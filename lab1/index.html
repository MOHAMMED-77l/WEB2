ٍ<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>

<body>
<div class="container">

<h1 class="mt-5">GPA Calculator</h1>

<div id="result"></div>

<form id="gpaForm">

<input type="text" name="student_name" class="form-control mb-2" placeholder="Student Name" required>

<input type="text" name="semester" class="form-control mb-3" placeholder="Semester (e.g. S1 2026)" required>

<div id="courses">
<div class="course-row form-row mb-2">
<div class="col">
<input type="text" name="course[]" class="form-control" placeholder="Course name" required>
</div>
<div class="col-2">
<input type="number" name="credits[]" class="form-control" placeholder="Credits" min="1" required>
</div>
<div class="col-2">
<select name="grade[]" class="form-control">
<option value="4.0">A</option>
<option value="3.0">B</option>
<option value="2.0">C</option>
<option value="1.0">D</option>
<option value="0.0">F</option>
</select>
</div>
</div>
</div>

<button type="button" id="addCourse" class="btn btn-secondary mb-3">
+ Add Course
</button>

<button type="submit" class="btn btn-primary">
Calculate GPA
</button>

<a href="history.php" class="btn btn-info">View History</a>
<a href="export.php" class="btn btn-success">Download CSV</a>

</form>
</div>
</body>
</html>
